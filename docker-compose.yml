services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: c_ride_admin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: cRide
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres.gxqzzxuasvckkrblawqt:TqOwWp4E7TUb25SEQ9xcFHMRc5tm1fqn@aws-1-eu-central-1.pooler.supabase.com:5432/postgres?pgbouncer=true&connection_limit=5&pool_timeout=30
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
      NODE_ENV: production
      # add all other vars from your .env here, or use env_file: .env
    env_file:
      - .env.docker

volumes:
  pg_data: